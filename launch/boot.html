<title>AlgoForge</title>
<!-- ══════════════════════════════════════════════════════════════════
     启动动画页（本地文件，**不需要服务器**）。

     为什么要有这一页：
     以前的顺序是「检查 → 起服务 → 开窗 → 加载页面 → 动画」，动画是最后一环，
     所以它盖不住前面任何一段，人要干等 4~5 秒才看到东西。
     现在 open-app.ps1 不等服务就先用 --app=file://… 打开这一页，
     动画和「起服务」并行跑；服务一就绪就跳到 http://localhost，
     剩下的"让位"由界面里那套用负 animation-delay 接着演（见 src/bootSplash.js 的 BOOT_PART1）。

     ⚠ 这一页是 file:// 打开的，所以：
       · 不能引用 dist/ 或 public/ 里的东西（源码版和打包版路径不一样），
         三张笔画图**内联**进来，由 scripts/make-boot-html.mjs 生成。
       · 探测服务用 new Image()，不用 fetch —— file:// 到 http://localhost 是跨源，
         fetch 会被拦，而图片加载不受 CORS 限制。
       · 路径里几乎必有空格（包名形如「AlgoForge v2.1.0」），解压出来还常带 (1)；
         使用者又常把它放在中文目录下。open-app.ps1 必须用
         [System.Uri].AbsoluteUri 做百分号编码后再传。
         实测编码之后参数里没有空格，正好绕开本项目栽过两次的
         「Start-Process -ArgumentList 不加引号」那个坑。

     ⚠ 这里的编排是 src/index.css 那套的**第二份拷贝**（两个入口各一份，
       一个走 file://、一个走 http://，没法共用一个 CSS 文件）。
       scripts/test-bootsplash.mjs 里有一条闸门把两边的关键数字比一遍，
       防止改了一边忘了另一边。
     ══════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#0e1014; --text:#eceef4; --muted:#8b93a6; --warn:#dfb05f;
  --boot-d:2000ms;  /* 由 make-boot-html.mjs 从 BOOT_MIN_MS 填入，别在这里写死 */
  --push:1;
  --exit:max(320px, 62vw);
  --lh:1.5;   /* 同上，从 index.css 的 body line-height 填入。
                             行高不同 -> 文字行盒高度不同 -> 接缝处基线上下错半格。 */
  --font:-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;   /* 由 make-boot-html.mjs 从 index.css 的 --font-sans 填入。
                        别在这里写死：两边字体不同会让标语在接缝处宽度突变。 */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:var(--lh);
  display:grid;place-items:center}

             0 0 46px 6px rgba(252,147,57,.30)}

.gl,.gr{filter:drop-shadow(0 3px 5px rgba(0,0,0,.6))}
.gs{filter:drop-shadow(0 0 9px rgba(252,147,57,.75))}

.name{position:absolute;left:50%;top:calc(50% + 150px);transform:translateX(-50%);
  font-size:22px;font-weight:600;white-space:nowrap;z-index:4}
.slogan{position:absolute;left:50%;top:calc(50% + 180px);transform:translateX(-50%);
  font-size:13px;color:var(--muted);white-space:nowrap;z-index:4}
.spill{position:absolute;top:50%;left:50%;width:6%;height:46%;transform:translate(-50%,-50%);
  filter:blur(14px);opacity:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(252,147,57,.55),
    rgba(255,238,214,.75),rgba(252,147,57,.55),transparent)}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,transparent 46%,rgba(0,0,0,.72) 92%)}

/* ── 第一段：拉开（0 → 66%），走完停在「定格」 ──
   刻意用 forwards 停住：服务还没就绪时就一直定在这一拍，
   这正是「拉开定格」这套编排能拿来等的原因。 */
.logo{animation:dolly calc(var(--boot-d)*0.66) cubic-bezier(.3,0,.25,1) forwards}
.brick{animation:brick calc(var(--boot-d)*0.66) cubic-bezier(.3,0,.2,1) forwards}
.gl{animation:door-l calc(var(--boot-d)*0.66) cubic-bezier(.32,0,.12,1) forwards}
.gr{animation:door-r calc(var(--boot-d)*0.66) cubic-bezier(.32,0,.12,1) forwards}
.gs{animation:slash  calc(var(--boot-d)*0.66) cubic-bezier(.35,0,.2,1) forwards}
.name,.slogan{animation:word calc(var(--boot-d)*0.66) ease forwards}
.spill{animation:spill calc(var(--boot-d)*0.66) ease-out forwards}
.vig{animation:vig calc(var(--boot-d)*0.66) ease-out forwards}

@keyframes dolly{0%{transform:scale(calc(1 - .12*var(--push)))}
                 100%{transform:scale(calc(1 + .16*var(--push)))}}
@keyframes brick{0%{opacity:0;transform:scale(.9)}
                 21%{opacity:1;transform:scale(1)}
                 100%{opacity:.95;transform:scale(1)}}
@keyframes door-l{0%{transform:translateX(0) scale(.9);opacity:0}
                  21%{transform:translateX(0) scale(1);opacity:1}
                  100%{transform:translateX(calc(var(--exit)*-.62)) scale(1.08);opacity:1}}
@keyframes door-r{0%{transform:translateX(0) scale(.9);opacity:0}
                  21%{transform:translateX(0) scale(1);opacity:1}
                  100%{transform:translateX(calc(var(--exit)*.62)) scale(1.08);opacity:1}}
@keyframes slash{0%{transform:rotate(0) scale(.9);opacity:0}
                 21%{transform:rotate(0) scale(1);opacity:1}
                 100%{transform:rotate(360deg) scale(1);opacity:1}}
@keyframes word{0%,24%{opacity:0;transform:translate(-50%,12px)}
                52%{opacity:1;transform:translate(-50%,0)}
                100%{opacity:1;transform:translate(-50%,0)}}
@keyframes spill{0%,30%{opacity:0;transform:translate(-50%,-50%) scaleX(1)}
                 100%{opacity:.9;transform:translate(-50%,-50%) scaleX(6)}}
@keyframes vig{0%{opacity:calc(.5*var(--push))}100%{opacity:calc(.22*var(--push))}}

/* 服务迟迟不来时的人话。绝不能让人对着一个永远转的动画。 */
.msg{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
  max-width:30em;text-align:center;font-size:13px;line-height:1.8;color:var(--warn);
  opacity:0;transition:opacity .4s ease;z-index:5}
.msg.on{opacity:1}
.msg code{font-family:Consolas,monospace;background:#181b26;padding:1px 6px;border-radius:4px;
  color:var(--text)}

/* 减弱动效：全部停在「拼好的 logo」这个静止状态，别推到末帧（那是全透明=黑屏）。 */
@media (prefers-reduced-motion: reduce){
  .logo,.brick,.gl,.gr,.gs,.name,.slogan,.spill,.vig{animation:none !important}
  .spill,.vig{opacity:0}
}
</style>
</head>
<body>
  <div class="logo">
    <div class="brick"></div>
    <i class="g gl"></i><i class="g gs"></i><i class="g gr"></i>
  </div>
  <div class="spill"></div>
  <div class="name">AlgoForge</div>
  <div class="slogan">Forge the Logic. Sharpen the Mind.</div>
  <div class="vig"></div>
  <p class="msg" id="msg"></p>

<script>
(function () {
  'use strict';
  var APP = 'http://localhost:5178/';
  var HOLD_MS = 2000;        // 与 bootSplash.js 的 BOOT_MIN_MS 同口径
  var PART1 = 0.66;            // 演到这个比例就交给界面（BOOT_PART1）
  /* 比启动器自己的等待上限（40 秒）稍晚一点放弃：那边超时会弹一个信息量更大的
     窗口（带日志尾巴），让它先说话，这里只兜住"弹窗也没出现"的情况。 */
  var GIVE_UP_MS = 45000;
  var t0 = Date.now();
  var done = false;

  var msg = document.getElementById('msg');
  function say(html) { msg.innerHTML = html; msg.className = 'msg on'; }

  /* 探测服务：用 Image 而不是 fetch —— file:// 到 http://localhost 是跨源，
     fetch 会被拦掉，而图片加载不受 CORS 限制（已实测）。 */
  function probe(cb) {
    var img = new Image(), fired = false;
    var timer = setTimeout(function () { if (!fired) { fired = true; cb(false); } }, 900);
    img.onload = function () { if (!fired) { fired = true; clearTimeout(timer); cb(true); } };
    img.onerror = function () { if (!fired) { fired = true; clearTimeout(timer); cb(false); } };
    img.src = APP + 'favicon.ico?boot=' + Date.now();
  }

  function leave() {
    if (done) return;
    done = true;
    /* 立刻跳转，「让位」交给界面那边接着演（?boot=1 会让它用负 animation-delay
       从「定格」那一帧接上）。这里**不要**先把让位演完再跳 ——
       那样中间会有约 600ms 黑屏，界面变成"突然出现"。 */
    location.replace(APP + '?boot=1');
  }

  function tick() {
    if (done) return;
    probe(function (up) {
      if (up) {
        /* 就算服务立刻就绪，也要让「拉开」那一段放完再走，不然动画被切在半路。 */
        var wait = Math.max(0, Math.round(HOLD_MS * PART1) - (Date.now() - t0));
        setTimeout(leave, wait);
        return;
      }
      if (Date.now() - t0 > GIVE_UP_MS) {
        say('本地服务没能起来，界面打不开了。<br>请关掉这个窗口重新双击一次；'
          + '还是这样的话，把日志发给给你这个工具的人：<br><code>%LOCALAPPDATA%\\Hot100Trainer\\launcher.log</code>');
        return;
      }
      if (Date.now() - t0 > 8000) {
        say('正在启动本地服务，第一次可能要久一点…');
      }
      setTimeout(tick, 150);
    });
  }
  tick();
}());
</script>
</body>
</html>
